# claude's daily hacker news addiction
# actually READS articles and comments, not just titles

name: hn digest

on:
  schedule:
    # 4x daily (+8 timezone), next day starts at 09:00
    - cron: "0 1 * * *"   # 09:00 +8
    - cron: "0 6 * * *"   # 14:00 +8
    - cron: "0 11 * * *"  # 19:00 +8
    - cron: "0 16 * * *"  # 00:00 +8 (midnight)
  workflow_dispatch:
    inputs:
      story_count:
        description: "stories to fetch"
        default: "20"
        type: string

# prevent duplicate runs - if one is running, cancel the new one
concurrency:
  group: hn-digest
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write          # ci-alert.sh tracking issue (one, auto-closed)

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDE_YOLO_APP_ID }}
          private-key: ${{ secrets.CLAUDE_YOLO_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      # One step decides the edition's identity: which contracted slot this run
      # serves, or whether the slot is already filled and there is nothing to do.
      # The rules and the evidence behind them live in the script.
      - name: claim the edition slot
        id: slot
        run: .github/scripts/edition-slot.py

      - name: fetch hacker news with content
        if: steps.slot.outputs.skip != 'true'
        run: |
          TARGET_COUNT="${{ inputs.story_count || '20' }}"
          echo "target: $TARGET_COUNT stories for Claude to evaluate"
          mkdir -p /tmp/hn

          # light dedup: only skip stories from last 24h (Claude does smart filtering)
          RECENT_IDS=""
          TODAY=$(date -u +%Y/%m/%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y/%m/%d 2>/dev/null || date -u -v-1d +%Y/%m/%d)
          shopt -s nullglob
          for f in digests/$TODAY*.org digests/$TODAY*.md digests/$YESTERDAY*.org digests/$YESTERDAY*.md; do
            # org format uses :ID: property, md uses item?id=
            if [[ "$f" == *.org ]]; then
              RECENT_IDS="$RECENT_IDS $(grep -oE ':ID:\s+[0-9]+' "$f" 2>/dev/null | grep -oE '[0-9]+')"
            else
              RECENT_IDS="$RECENT_IDS $(grep -oE 'item\?id=[0-9]+' "$f" 2>/dev/null | cut -d= -f2)"
            fi
          done
          shopt -u nullglob
          echo "recent (24h): $(echo $RECENT_IDS | wc -w) stories to skip"

          # fetch pool, light filter, give Claude more to work with
          ALL_IDS=$(curl -s "https://hacker-news.firebaseio.com/v0/topstories.json" | jq -r '.[:100] | .[]')
          FINAL_IDS=""
          COUNT=0
          for id in $ALL_IDS; do
            if ! echo " $RECENT_IDS " | grep -q " $id "; then
              FINAL_IDS="$FINAL_IDS $id"
              COUNT=$((COUNT + 1))
              [ $COUNT -ge $TARGET_COUNT ] && break
            fi
          done
          echo "pool for Claude: $COUNT stories"

          echo "# Hacker News Top Stories" > /tmp/hn/stories.md
          echo "Fetched at: $(date -u '+%Y-%m-%d %H:%M UTC')" >> /tmp/hn/stories.md
          echo "Edition slot: ${{ steps.slot.outputs.digest_date }} -> ${{ steps.slot.outputs.digest_path }}" >> /tmp/hn/stories.md
          echo "" >> /tmp/hn/stories.md

          IDX=1
          for id in $FINAL_IDS; do
            echo "[$IDX] fetching story $id"
            STORY=$(curl -s "https://hacker-news.firebaseio.com/v0/item/$id.json")

            TITLE=$(echo $STORY | jq -r '.title // "untitled"')
            URL=$(echo $STORY | jq -r '.url // empty')
            [ -z "$URL" ] && URL="https://news.ycombinator.com/item?id=$id"
            SCORE=$(echo $STORY | jq -r '.score // 0')
            BY=$(echo $STORY | jq -r '.by // "anon"')
            DESCENDANTS=$(echo $STORY | jq -r '.descendants // 0')
            TEXT=$(echo $STORY | jq -r '.text // empty')
            KIDS=$(echo $STORY | jq -r '.kids // []')
            HN_URL="https://news.ycombinator.com/item?id=$id"

            echo "" >> /tmp/hn/stories.md
            echo "---" >> /tmp/hn/stories.md
            echo "## $IDX. $TITLE" >> /tmp/hn/stories.md
            echo "- Score: $SCORE | Comments: $DESCENDANTS | By: $BY" >> /tmp/hn/stories.md
            echo "- HN: $HN_URL" >> /tmp/hn/stories.md
            echo "- Article: $URL" >> /tmp/hn/stories.md

            # text posts
            if [ -n "$TEXT" ]; then
              echo "" >> /tmp/hn/stories.md
              echo "Post:" >> /tmp/hn/stories.md
              echo "$TEXT" | head -c 1500 >> /tmp/hn/stories.md
              echo "" >> /tmp/hn/stories.md
            fi

            # top 3 comments
            COMMENT_IDS=$(echo $KIDS | jq -r '.[:3] | .[]' 2>/dev/null || true)
            if [ -n "$COMMENT_IDS" ]; then
              echo "" >> /tmp/hn/stories.md
              echo "Top comments:" >> /tmp/hn/stories.md
              for cid in $COMMENT_IDS; do
                COMMENT=$(curl -s "https://hacker-news.firebaseio.com/v0/item/$cid.json")
                C_BY=$(echo $COMMENT | jq -r '.by // "anon"')
                C_TEXT=$(echo $COMMENT | jq -r '.text // ""' | sed 's/<[^>]*>//g' | head -c 400)
                [ -n "$C_TEXT" ] && echo "> $C_BY: $C_TEXT" >> /tmp/hn/stories.md
              done
            fi

            # article preview for top 3
            if [ $IDX -le 3 ] && [ -n "$URL" ] && [[ "$URL" != *"news.ycombinator.com"* ]]; then
              echo "  fetching article..."
              ARTICLE=$(curl -sL --max-time 8 "$URL" 2>/dev/null | sed 's/<[^>]*>//g' | tr -s ' \n' ' ' | head -c 2000 || true)
              if [ -n "$ARTICLE" ]; then
                echo "" >> /tmp/hn/stories.md
                echo "Article preview:" >> /tmp/hn/stories.md
                echo "$ARTICLE" >> /tmp/hn/stories.md
              fi
            fi

            IDX=$((IDX + 1))
          done

          echo "=== STORIES FILE ==="
          wc -l /tmp/hn/stories.md

      - name: setup git
        if: steps.slot.outputs.skip != 'true'
        run: |
          git config user.name "claude-yolo[bot]"
          git config user.email "claude-yolo[bot]@users.noreply.github.com"

      - name: clear claude locks
        if: steps.slot.outputs.skip != 'true'
        run: rm -rf ~/.local/state/claude/locks ~/.claude/.locks

      - name: let claude curate
        id: curate
        if: steps.slot.outputs.skip != 'true'
        timeout-minutes: 25
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DIGEST_DATE: ${{ steps.slot.outputs.digest_date }}
          DIGEST_PATH: ${{ steps.slot.outputs.digest_path }}
          # WebFetch uses the haiku slot rather than the curator's model. Keep
          # that slot on an available model explicitly; the historian follows
          # the curator through `model: inherit`.
          ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5-20251001
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # The action hides the transcript by default, so a timeout is a blank
          # 15 minutes with no way to see what ran. Logs are public, but every
          # secret here is registered with Actions and masked.
          show_full_output: true
          # Bare `Bash`, on purpose. The old fork mangled `Bash(git:*)` into
          # `Bash` on the way to the CLI, so for 6.5 months the curator ran
          # with every shell command allowed and nobody knew. The upstream
          # action passes scoped rules through intact, which silently denied
          # steps 5-7 (python3 json2org.py, llms-gen.py, org2html.py); the
          # first upstream run logged 13 denials and every later one hit the
          # timeout. This is the permission set the pipeline was actually
          # built against, stated instead of inherited from a bug.
          claude_args: |
            --model claude-opus-5
            --allowedTools Bash,Read,Write,Edit,WebFetch,mcp__barkme__notify
            --mcp-config '{
              "mcpServers": {
                "barkme": {
                  "command": "npx",
                  "args": ["@vibeworks/barkme-mcp-server"],
                  "env": {
                    "LOG_LEVEL": "debug",
                    "BARK_DEVICES": "${{ secrets.BARK_DEVICES }}",
                    "BARK_SERVER": "${{ secrets.BARK_SERVER }}",
                    "BARK_GROUP": "Claude HN Digest",
                    "BARK_ICON": "https://raw.githubusercontent.com/thevibeworks/claude-reads-hn/main/icon.png",
                    "BARK_RETRY": "3",
                    "BARK_ASYNC": "false"
                  }
                }
              }
            }'
          prompt: |
            ## House Style

            You are writing a news digest. Nothing here is a reply: there is no user
            in this job, no conversation, no follow-up.

            - Speak plainly. Concrete, jargon-free, no throat-clearing. Never open a
              sentence with "Ah", "Alright", "Oh", "Of course", "Yeah" or "Ugh", and
              skip stock interjections ("wow", "great", "fine"). No em dashes.
            - Name companies, people and products directly whenever the story is
              about them.
            - Stories about death, illness, grief or mental health get plain factual
              treatment. No joke, no consolation, no editorialising.
            - Do not reproduce song lyrics or other copyrighted material. Quote
              articles and comments only as far as the point needs.

            ---

            You are the HN curator. Read /tmp/hn/stories.md - it has titles, scores, comments, article previews.

            THIS EDITION'S SLOT (fixed by the workflow; never compute or guess it):
            - date:          ${{ steps.slot.outputs.digest_date }}
            - org file:      ${{ steps.slot.outputs.digest_path }}
            - anchor suffix: ${{ steps.slot.outputs.anchor }}
            - commit line:   hn: ${{ steps.slot.outputs.display }} digest
            Use exactly these for the JSON "date", the org path, every notification link, and the commit message.

            DO THE WORK:

            0. CHECK HISTORY (use hn-historian subagent):
               - Read llms.txt - your memory index of all covered stories
               - For each candidate story in /tmp/hn/stories.md, check if ID or topic exists
               - FRESH = never covered
               - REVISIT = covered but comments 2x+ growth
               - SKIP = already covered recently

            1. Read the stories file carefully
            2. Pick 5 FRESH stories (mix topics, high engagement, spicy discussions)

            3. READ THE ORIGINAL ARTICLES (critical for quality TLDRs):
               For each selected story:
               a) Try to fetch article content using WebFetch tool
               b) If direct URL fails (paywall, 403, timeout), use Jina AI proxy:
                  https://r.jina.ai/{article_url}
               c) Read and understand the actual content before writing TLDR
               d) If both fail, note in TLDR: "[from title + comments, article unreachable]"

            4. Write digest JSON to /tmp/digest.json:

            ```json
            {
              "date": "${{ steps.slot.outputs.digest_date }}",
              "vibe": "iRobot files for bankruptcy, Arduino is acquired, and HN argues about taxing robots",
              "highlights": [
                "Roomba: Chinese supplier takes over iRobot",
                "Hashcards: Plain-text flashcards that import into Anki"
              ],
              "stories": [
                {
                  "id": 46268854,
                  "title": "Robot vacuum Roomba maker files for bankruptcy after 35 years",
                  "url": "https://news.bloomberglaw.com/...",
                  "hn_url": "https://news.ycombinator.com/item?id=46268854",
                  "points": 191,
                  "comments_count": 182,
                  "by": "username",
                  "tldr": "iRobot filed Chapter 11 bankruptcy and is being taken over by its Chinese supplier.",
                  "take": "Roborock shipped better mapping and suction at a lower price for years. The bankruptcy is the delayed cost of iRobot never matching it.",
                  "tags": ["robotics", "hardware", "bankruptcy"],
                  "comments": [
                    {"by": "simonjgreen", "text": "This is the cost of complacency.", "id": 46269123},
                    {"by": "furyg3", "text": "Are there good robo-vacuums that work offline?", "id": 46269456}
                  ],
                  "i18n": {
                    "zh": {
                      "title": "扫地机器人 Roomba 制造商 35 年后申请破产",
                      "tldr": "iRobot 申请了第 11 章破产，被中国供应商接管。",
                      "take": "Roborock 多年来以更低的价格提供了更好的地图和吸力功能，破产是 iRobot 一直没有跟进的代价。",
                      "comments": ["这是自满的代价。", "有没有断网也能用的扫地机器人？"]
                    },
                    "ja": {
                      "title": "ロボット掃除機Roombaメーカーが35年後に破産申請",
                      "tldr": "iRobotがChapter 11破産を申請。",
                      "take": "Roborockは何年も低価格でより優れたマッピングと吸引力を提供してきた。破産はそれに追随しなかった代償だ。",
                      "comments": ["これが自己満足の代償だ。", "オフラインで動くロボット掃除機はある？"]
                    }
                  }
                }
              ]
            }
            ```

            TRANSLATION RULES:
            - i18n object per story with title, tldr, take, and comments translated
            - Languages: es (Spanish), de (German), ko (Korean), ja (Japanese), zh (Chinese)
            - Translate: title, tldr, take, and all comments for each story
            - comments array must match order of original comments
            - Keep: URLs, tags, usernames unchanged

            5. CONVERT TO ORG: run ./.claude/skills/hn-digest/scripts/json2org.py /tmp/digest.json ${{ steps.slot.outputs.digest_path }}

            6. UPDATE MEMORY: run ./.claude/skills/hn-digest/scripts/llms-gen.py (regenerates llms.txt from all digests)

            7. BUILD THE SITE: run ./.claude/skills/hn-digest/scripts/org2html.py digests/*/*/*.org
               This writes (only files whose content changed):
               - index.html: the latest edition + last 7 days
               - e/YYYY/MM/DD-HHMM.html: one page per edition
               - archive.html, editions.json: the ledger and its index

            8. Git add digests/ llms.txt index.html archive.html e/ editions.json, commit as "hn: ${{ steps.slot.outputs.display }} digest", push

            9. NOTIFY ALL CHANNELS:
               BASE_URL: https://thevibeworks.github.io/claude-reads-hn

               STORY LINK FORMAT (CRITICAL - must match exactly):
               - Edition page: e/YYYY/MM/DD-HHMM.html (from the digest date)
               - Anchor on it: #s{id}-{MMDDHHMM} where {id} is story ID, {MMDDHHMM} is digest datetime
               - Example: story 46268854 from the 2025-12-27 11:00 digest ->
                 https://thevibeworks.github.io/claude-reads-hn/e/2025/12/27-1100.html#s46268854-12271100
               - Minutes required: multiple digests can exist in same hour (0240, 0259)

               a) BARK (use mcp__barkme__notify) - one ping to wake human:
                  - title: digest vibe (the catchy summary)
                  - body: "5 stories curated" or spiciest take
                  - url: https://thevibeworks.github.io/claude-reads-hn

               b) TELEGRAM (if TG_BOT_TOKEN is set) - send EACH story separately:
                  For each of the 5 stories, send one message.
                  IMPORTANT: Escape HTML entities (< → &lt; > → &gt; & → &amp;)

                  Anchor = #s{story_id}-{MMDDHHMM} from digest date.
                  Example: digest "2025-12-27T11:00:00Z", story 46268854 → #s46268854-12271100

                  curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
                    -H "Content-Type: application/json" \
                    -d '{
                      "chat_id": "'"$TG_CHANNEL_ID"'",
                      "parse_mode": "HTML",
                      "disable_web_page_preview": false,
                      "text": "<b>TITLE</b>\n\nTLDR\n\n<i>Take: OPINION</i>\n\n<a href=\"https://thevibeworks.github.io/claude-reads-hn/e/2025/12/27-1100.html#s46268854-12271100\">Read →</a> | <a href=\"https://news.ycombinator.com/item?id=46268854\">HN</a>"
                    }'

                  Build: "s" + story.id + "-" + date[5:7] + date[8:10] + date[11:13] + date[14:16]
                  Sends 5 messages, one per story.

               c) DISCORD (if DISCORD_WEBHOOK_URL is set) - single rich embed:
                  Anchor format: #s{id}-{MMDDHHMM}

                  curl -s -X POST "$DISCORD_WEBHOOK_URL" \
                    -H "Content-Type: application/json" \
                    -d '{
                      "embeds": [{
                        "title": "📰 VIBE_SUMMARY",
                        "description": "• [Title1](https://thevibeworks.github.io/claude-reads-hn/e/2025/12/27-1100.html#s46268854-12271100) - tldr1\n• [Title2](.../e/2025/12/27-1100.html#s46268855-12271100) - tldr2\n...",
                        "url": "https://thevibeworks.github.io/claude-reads-hn",
                        "color": 16737280,
                        "footer": {"text": "Claude Reads HN • 4x daily"}
                      }]
                    }'

                  All stories in same digest share the MMDDHHMM suffix.

            RULES:
            - READ THE DAMN ARTICLE first via WebFetch or Jina proxy (https://r.jina.ai/{url})
            - TLDR must reflect ACTUAL content you read, not guesses from title
            - Take must be YOUR opinion: a judgement the article and comments support
            - Remove all mannered prose. When a literal statement is available, use it
              instead of metaphor, flourish, or language that performs the writer
              rather than conveying the meaning.
            - This is about mechanism, not a banned-phrase list. A stock phrase you
              have not seen listed is still mannered prose. Ask of each sentence: does
              it carry information a reader could act on, or does it only signal that
              the writer is clever? Cut the second kind.
            - Include both article URL and HN discussion URL
            - Comments: pick 2-3 contrasting/opposing views to create discourse resonance
            - Tags: lowercase #hashtags (e.g. #rust, #ai, #startup, #security)
            - No fluff, no "skip" lists, no redundant summaries
            - ALWAYS notify after git push - BARK first to wake human, then TG/Discord
            - If any notification fails, retry once then move on

            LINK REFERENCE:
            - Base URL: https://thevibeworks.github.io/claude-reads-hn
            - Edition page: e/YYYY/MM/DD-HHMM.html from the digest date
              (this edition: ${{ steps.slot.outputs.digest_path }} with .org -> .html, under e/ instead of digests/)
            - Anchor: #s{id}-{MMDDHHMM} (e.g., #s46268854-12271100)
              (this edition: #s{id}-${{ steps.slot.outputs.anchor }})
            - Build: "s" + id + "-" + date[5:7] + date[8:10] + date[11:13] + date[14:16]
            - Example: digest "2025-12-27T11:00:00Z" + story 46268854 →
              https://thevibeworks.github.io/claude-reads-hn/e/2025/12/27-1100.html#s46268854-12271100
            - Minutes required: digests like 0240.org and 0259.org need distinct anchors

      # A green run must mean an edition on main. The curate step exits 0
      # whenever Claude finishes, whether or not it wrote, built, or pushed
      # anything, so until now "success" and "did nothing" were the same
      # colour. Assert the artifact, not the exit code.
      - name: verify the edition landed
        if: steps.slot.outputs.skip != 'true'
        run: |
          git fetch -q origin main
          missing=0
          for f in "${{ steps.slot.outputs.digest_path }}" "${{ steps.slot.outputs.page_path }}"; do
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              echo "landed: $f"
            else
              echo "::error::$f is not on origin/main after the curate step"
              missing=1
            fi
          done
          exit $missing

      # A red run is not always a broken run. Every digest failure since the
      # tripwire went in has been the shared Claude OAuth token hitting its
      # cap -- 2026-09-02 05:32 "Spending cap reached resets 6am", 10:55
      # "...resets 11am" -- which no change in this repo can fix. Filed under
      # the same title as a real defect, those turn the one channel that is
      # supposed to mean "something broke" into a quota log, and the first
      # genuine bug arrives looking like the twentieth false alarm. Capacity
      # and defect are different problems with different owners, so they get
      # different issues. The quota issue is not noise to be silenced: it
      # counts occurrences, because "how often are the bots starving" is the
      # number that decides whether this account needs its own seat.
      - name: classify the failure
        id: why
        if: failure() && steps.slot.outputs.skip != 'true'
        run: |
          f="${{ steps.curate.outputs.execution_file }}"
          reason=defect
          if [ -n "$f" ] && [ -f "$f" ]; then
            # Match the final result object only, never the whole file: the
            # execution file carries the entire transcript, and this curator
            # reads Hacker News, so a front-page story about API spending caps
            # would otherwise file a genuine defect under "quota".
            last_result=$(grep -Eo '"result": *"[^"]{0,300}' "$f" | tail -1 || true)
            api_status=$(grep -Eo '"api_error_status": *[0-9]+' "$f" | tail -1 || true)
            echo "final result: ${last_result:-<none>}"
            if echo "$last_result" | grep -Eqi '(spending cap|session limit|usage limit|rate limit)' \
               || echo "$api_status" | grep -Eq '429'; then
              reason=quota
            fi
          fi
          if [ "$reason" = quota ]; then
            echo "::warning::out of Claude quota -- capacity, not a defect"
          fi
          echo "reason=$reason" >> $GITHUB_OUTPUT

      - name: alert on failure
        if: failure() && steps.slot.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-alert.sh open "${{ github.run_id }}" "${{ steps.why.outputs.reason }}"

      - name: clear alert on success
        if: success() && steps.slot.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-alert.sh close
